<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PID Control, Explained</title>
    <meta name="description" content="An interactive explanation of PID control: tune P, I, and D on a simulated cart and watch the response, with live plots and step-response metrics.">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&family=Instrument+Serif:ital@0;1&family=STIX+Two+Text:ital,wght@0,400;1,400&display=swap">
    <link rel="stylesheet" href="styles/app.css">
    <script>
        // ?theme=light|dark (set by embedding pages) wins over the system preference.
        const t = new URLSearchParams(location.search).get('theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    </script>
</head>
<body>
    <div class="app">
        <header class="top">
            <div class="title">
                <h1>PID Control, <em>Explained</em></h1>
                <p class="equation" aria-label="u equals K p times e, plus K i times the integral of e, minus K d times the derivative of x">
                    <span class="var">u</span> =
                    <button class="term p" data-term="proportional">K<sub>p</sub>&#8202;<span class="var">e</span></button> +
                    <button class="term i" data-term="integral">K<sub>i</sub>&#8202;∫<span class="var">e</span>&#8202;dt</button> −
                    <button class="term d" data-term="derivative">K<sub>d</sub>&#8202;d<span class="var">x</span>/dt</button>
                </p>
            </div>
            <div class="actions">
                <button class="btn" id="play-btn" aria-pressed="true"><span class="ico">❚❚</span> Pause</button>
                <button class="btn" id="replay-btn"><span class="ico">↺</span> Replay step</button>
                <button class="btn" id="push-btn"><span class="ico">↯</span> Push cart</button>
                <button class="btn btn-learn" id="learn-btn">Learn</button>
            </div>
        </header>

        <main class="main">
            <section class="left">
                <div class="card stage-card">
                    <div class="card-head">
                        <span class="label">Cart on a rail · force-controlled</span>
                        <span class="hint">click the rail to move the target</span>
                    </div>
                    <canvas id="stage" aria-label="A cart on a rail, pushed by the PID controller towards the orange target marker. Click the rail to move the target."></canvas>
                </div>

                <div class="metrics" aria-live="polite">
                    <button class="metric" data-term="rise-time"><span class="k">Rise time</span><span class="v" id="m-rise">—</span></button>
                    <button class="metric" data-term="overshoot"><span class="k">Overshoot</span><span class="v" id="m-overshoot">—</span></button>
                    <button class="metric" data-term="settling-time"><span class="k">Settling time</span><span class="v" id="m-settle">—</span></button>
                    <button class="metric" data-term="steady-state-error"><span class="k">Steady-state error</span><span class="v" id="m-sse">—</span></button>
                </div>

                <div class="card plot-card">
                    <div class="card-head">
                        <span class="label">Position</span>
                        <span class="legend">
                            <span class="key target">target <b id="l-target">—</b></span>
                            <span class="key position">position <b id="l-position">—</b></span>
                            <span class="key band">±2% band</span>
                        </span>
                    </div>
                    <canvas id="plot-position" aria-label="Plot of target and position over the last 10 seconds"></canvas>
                </div>

                <div class="card plot-card">
                    <div class="card-head">
                        <button class="label" data-term="control-signal">Control force</button>
                        <span class="legend">
                            <span class="key u">u <b id="l-u">—</b></span>
                            <span class="key p">P <b id="l-p">—</b></span>
                            <span class="key i">I <b id="l-i">—</b></span>
                            <span class="key d">D <b id="l-d">—</b></span>
                            <span class="key sat">±100 limit</span>
                        </span>
                    </div>
                    <canvas id="plot-force" aria-label="Plot of the control force and its P, I and D terms over the last 10 seconds"></canvas>
                </div>
            </section>

            <aside class="right">
                <section class="panel">
                    <h2>Gains</h2>
                    <div class="gain p">
                        <label for="kp"><button class="name" data-term="proportional">K<sub>p</sub></button><span class="what">spring</span><output id="kp-out">—</output></label>
                        <input type="range" id="kp" min="0" max="20" step="0.1">
                    </div>
                    <div class="gain i">
                        <label for="ki"><button class="name" data-term="integral">K<sub>i</sub></button><span class="what">memory</span><output id="ki-out">—</output></label>
                        <input type="range" id="ki" min="0" max="5" step="0.05">
                    </div>
                    <div class="gain d">
                        <label for="kd"><button class="name" data-term="derivative">K<sub>d</sub></button><span class="what">damper</span><output id="kd-out">—</output></label>
                        <input type="range" id="kd" min="0" max="20" step="0.1">
                    </div>
                </section>

                <section class="panel">
                    <h2>Presets</h2>
                    <div class="presets" id="presets"></div>
                    <p class="preset-note" id="preset-note"></p>
                </section>

                <section class="panel">
                    <h2>Scenario</h2>
                    <div class="field">
                        <label for="target">Target <output id="target-out">—</output></label>
                        <input type="range" id="target" min="5" max="95" step="1">
                    </div>
                    <div class="field">
                        <label for="tilt">Rail tilt <output id="tilt-out">—</output></label>
                        <input type="range" id="tilt" min="-15" max="15" step="0.5">
                    </div>
                    <label class="switch"><input type="checkbox" id="antiwindup"><span></span><button class="link" data-term="integral-windup">Anti-windup</button></label>
                    <label class="switch"><input type="checkbox" id="autostep"><span></span>Auto-step every 6 s</label>
                </section>
            </aside>
        </main>
    </div>

    <div class="drawer" id="drawer" hidden>
        <div class="drawer-backdrop" data-close></div>
        <aside class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
            <header class="drawer-head">
                <h2 id="drawer-title">Learn</h2>
                <button class="icon-btn" data-close aria-label="Close">✕</button>
            </header>
            <nav class="tabs" role="tablist">
                <button role="tab" data-category="concepts" aria-selected="true">Concepts</button>
                <button role="tab" data-category="terms">P, I and D</button>
                <button role="tab" data-category="advanced">Advanced</button>
            </nav>
            <div class="drawer-body" id="drawer-body"></div>
        </aside>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
